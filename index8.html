<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Availability</title>
    <link rel="stylesheet" href="styles8.css">
</head>
<body>
    
<table>
    <caption>Weekly Meeting Availability Schedule</caption>
    <thead>
        <tr class="sharp">
            <th scope="col">Time</th>
             <th scope="col">Monday</th>
             <th scope="col">Tuesday</th>
          </tr>    
         </thead>  
         <tbody>
         <tr class="half">
            <th scope="row" class="time">9:00 AM</th>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-1" aria-label="1 available"></td>
         </tr> 
         <tr class="sharp">
            <th scope="row" class="time">10:00 AM</th>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-0" aria-label="0 available"></td>
         </tr>
        <tr class="half">
            <th scope="row" class="time">11:00 AM</th>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
         </tr> 
         <tr class="sharp">
            <th scope="row" class="time">12:00 PM</th>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-1" aria-label="1 available"></td>
         </tr>
         </tbody>
         </table>
         
         <div id="legend">
            <span>Availability</span>
            <div id="legend-gradient"></div>
         </div>
</body>
</html>
