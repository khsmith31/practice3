<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Availability</title>
    <link rel="stylesheet" href="styles8.css">
</head>
<body>
    
<table>
    <caption>Meeting Availability</caption>
    <thead>
        <tr class="half">
            <th scope="row" class="time">9:00 AM</th>
             <td scope="available-0" aria-label="0 available"></td>
             <td class="available-1" aria-label="1 available"></td>
          </tr>    
   
        <tr class="sharp">
            <th scope="row" class="time">10:00 AM</th>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-3" aria-label="3 available"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
