<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Book Inventory</title>
  <link rel="stylesheet" href="style6.css">
</head>

<body>
<h1>Book Inventory</h1>

<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Author</th>
      <th>Category</th>
      <th>Status</th>
      <th>Rate</th>
     </tr>
     </thead>
  <tbody>
    <!-- The Great Gatsby Row -->
    <tr class="read">
      <td>The Great Gatsby</td>
      <td>F. Scott Fitzgerald</td>
      <td>Fiction</td>
      <td><span class="status">Read</span></td>
      <td>
        <span class="rate three">
          <span></span><span></span><span></span>
        </span>
      </td>
    </tr>

    <!-- 1984 Row -->
    <tr class="to-read">
      <td>1984</td>
      <td>George Orwell</td>
      <td>Dystopian</td>
      <td><span class="status">To Read</span></td>
      <td>
        <span class="rate one">
          <span></span><span></span><span></span>
        </span>
      </td>
    </tr>

    <!-- Dune Row -->
    <tr class="in-progress">
      <td>Dune</td>
      <td>Frank Herbert</td>
      <td>Sci-Fi</td>
      <td><span class="status">In Progress</span></td>
      <td>
        <span class="rate two">
          <span></span><span></span><span></span>
        </span>
      </td>
    </tr>
  </tbody>
</table>
</body>
</html>
