<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Landing Page</title>
    <link rel="stylesheet" href="style10.css">
</head>
<body>

    <header id="header">
        <img id="header-img" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo">

        <nav id="nav-bar">
          
            <a class="nav-link" href="#features">Features</a>
            <a class="nav-link" href="#product-video">Overview</a>
            <a class="nav-link" href="newsletter">Pricing</a>
        </nav>
    </header>
    
<main>

<section id="features" class="section-container">
    <h2>Premium Quality</h2>
    <p>Our products are made from the finest materials and undergo rigorous quality control to ensure you receive only the best.</p>

</section>

<section id="product-video" class="section-container">
    <h2>Product Overview</h2>
    <div class="video-wrapper">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Product Overview Video" frameborder="0" allowfullscreen></iframe>
    </div>
</section>

<section id="newsletter" class="section-container">
    <h2>Subscribe to Our Newsletter</h2>
    <form id="form" action="https://www.freecodecamp.com/email-submit" method="POST">
        <input type="email" name="email" id="email" placeholder="Enter your email" required>
        <input type="submit" id="submit" value="Subscribe">
    </form>
</section>
</main>




</body>
</html>
